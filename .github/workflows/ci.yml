name: CI

# Runs on every push and PR. The e2e job boots the real backend and a production frontend
# build and drives them with a browser, so a change that breaks the integration between the
# two fails here rather than during a judging demo.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routeOptimiserBackend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: routeOptimiserBackend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Verify demo seed script runs
        run: python seed_demo_data.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routeOptimiserFrontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: routeOptimiserFrontend/package-lock.json

      - name: Install dependencies
        run: npm install

      # No lint step: there is no ESLint configuration in this project, so the step that
      # used to sit here ran `npm run lint || true` against a script that does not exist and
      # reported a green tick for having done nothing. A build failure and the end-to-end
      # job below are the checks that actually hold; add a real linter here when there is
      # one to run.

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end browser tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Pin where Playwright keeps its browsers. The GitHub runner image sets
    # PLAYWRIGHT_BROWSERS_PATH to a pre-seeded /opt/pw-browsers, so `playwright install` and
    # the test run resolved different directories and the launch failed with "executable
    # doesn't exist" after a download that had apparently succeeded. Naming one path for the
    # whole job makes the two agree, whatever the image does.
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: routeOptimiserBackend
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Start backend
        working-directory: routeOptimiserBackend
        # Rainfall is live in normal operation. CI pins the shipped snapshot so the browser
        # assertions do not depend on today's weather in Meghalaya or on the runner reaching
        # Open-Meteo — and so the fallback path, the one that must never break, is what gets
        # exercised on every push.
        env:
          NER_LIVE_WEATHER: "0"
        run: |
          python seed_demo_data.py
          nohup python main.py > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5001/health && break
            sleep 2
          done

      - name: Build and serve frontend
        working-directory: routeOptimiserFrontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:5001
        run: |
          npm install
          npm run build
          nohup npx vite preview --port 4173 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ && break
            sleep 2
          done

      - name: Run end-to-end tests
        run: python e2e/test_e2e.py --base-url http://127.0.0.1:4173 --api-url http://127.0.0.1:5001

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: "*.png"
          if-no-files-found: ignore
